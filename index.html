<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Viewport ajustado para que no haga zoom incontrolado en celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#001E38">
    <title>BZN12 Studio MOBILE</title>
    
    <!-- FUENTES -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;800&family=Bebas+Neue&family=Chakra+Petch:wght@700&family=Do+Hyeon&family=Exo+2:wght@700&family=Fjalla+One&family=Kanit:wght@700&family=Oswald:wght@500;700&family=Passion+One:wght@700&family=Righteous&family=Roboto+Condensed:wght@300;400;700&family=Russo+One&family=Saira+Extra+Condensed:wght@700&family=Teko:wght@400;600&family=Titillium+Web:wght@700&family=Montserrat:wght@800&family=Playfair+Display:wght@700&family=Lobster&family=Orbitron:wght@700&family=Bangers&display=swap" rel="stylesheet">
    
    <!-- LIBRERÍA DE EXPORTACIÓN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

    <style>
        :root { 
            --azul: #001E38; 
            --oro: #F2C317; 
            --dark-bg: #000810; 
            --glass: rgba(30, 30, 30, 0.6);
        }
        
        /* === RESET & BASE === */
        html, body { margin: 0; padding: 0; font-family: 'Roboto Condensed', sans-serif; background: #080808; color: white; min-height: 100vh; padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
        * { box-sizing: border-box; user-select: none; }
        ::-webkit-scrollbar { display: none; }
        
        /* === NAVBAR === */
        .navbar { background: rgba(0, 30, 56, 0.95); backdrop-filter: blur(10px); padding: 15px; text-align: center; border-bottom: 2px solid var(--oro); position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .brand { font-family: 'Anton'; font-size: 24px; letter-spacing: 1px; }

        /* === PREVIEW SECTION (RESPONSIVE) === */
        .preview-section { 
            padding: 40px 10px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: radial-gradient(circle at center, #1a2a3a 0%, #000000 100%); 
            overflow: hidden;
            min-height: 520px;
        }
        
        /* Contenedor escalable para móviles */
        #banner-container { 
            position: relative; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); 
            border: 1px solid #333; 
            transform-origin: center center;
            transition: transform 0.3s ease;
        }

        /* LIENZO (Tamaño Fijo Interno) */
        .lienzo { width: 400px; height: 500px; position: relative; overflow: hidden; background: var(--dark-bg); }

        /* CAPAS DE FONDO */
        .fondo-img { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 1; transition: filter 0.2s; }
        .fondo-sombra { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at top right, transparent 30%, rgba(0,0,0,0.8) 100%); z-index: 2; pointer-events: none; }
        .overlay-dim { position: absolute; width: 100%; height: 100%; background: #000; opacity: 0; z-index: 2; pointer-events: none; }

        /* === JUGADOR Y EFECTOS === */
        #player-wrapper {
            position: absolute; bottom: 0; right: -50px; width: 300px; height: 75%; z-index: 5;
            transform-origin: bottom center; pointer-events: none; will-change: transform;
        }

        .player-glow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; display: none; transform: scale(1.03); }
        .player-main { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; }

        /* FADE ATMOSFÉRICO (Correcto) */
        .player-fade-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 45%; z-index: 6; pointer-events: none; display: none;
            background: linear-gradient(to top, var(--dark-bg) 15%, rgba(0, 8, 16, 0.95) 30%, rgba(0, 8, 16, 0.6) 55%, transparent 100%);
        }

        /* TEXTOS */
        .bloque-header-11 { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 10; }
        .logo-bzn { position: absolute; top: 20px; left: 20px; width: 50px; height: 50px; border-radius: 50%; background: var(--azul); border: 2px solid var(--oro); display: flex; align-items: center; justify-content: center; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .logo-bzn img, .escudo-mini, .logo-noticia img { width: 100%; height: 100%; object-fit: contain; }
        
        .titulo-formacion { position: absolute; top: 20px; left: 95px; z-index: 10; font-family: 'Teko'; font-weight: 600; font-size: 72px; color: white; letter-spacing: -1px; line-height: 0.8; text-shadow: 2px 2px 4px rgba(0,0,0,1); }
        .info-partido { position: absolute; top: 85px; left: 100px; z-index: 10; font-size: 16px; color: #ddd; font-family: 'Teko'; letter-spacing: 0.5px; text-shadow: 1px 1px 3px rgba(0,0,0,1); }
        .escudos-container { position: absolute; top: 25px; right: 20px; display: flex; gap: 5px; z-index: 50; }
        .escudo-mini { width: 45px; height: 45px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        
        .lista-jugadores { position: absolute; z-index: 5; top: 120px; left: 20px; display: flex; flex-direction: column; text-shadow: 1px 1px 3px black; }
        .fila-jugador { display: flex; align-items: center; line-height: 1.1; }
        .dorsal { font-family: 'Oswald'; font-weight: 700; color: var(--oro); width: 35px; text-align: right; margin-right: 12px; font-size: 1.1em; }
        .nombre-completo { text-transform: uppercase; letter-spacing: 0.5px; }
        .nombre-pila { font-family: 'Roboto Condensed'; font-weight: 300; color: rgba(255,255,255,0.7); margin-right: 6px; font-size: 1em; }
        .apellido { font-family: 'Roboto Condensed'; font-weight: 700; color: white; font-size: 1em; }
        
        .dt-info { position: absolute; bottom: 60px; left: 20px; z-index: 10; font-family: 'Teko'; font-size: 24px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 5px; width: 150px; text-shadow: 1px 1px 2px black; }
        .dt-label { color: var(--oro); font-weight: 700; margin-right: 10px; }
        .legal { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 10px; color: #777; z-index: 20; text-shadow: 1px 1px 2px black; }

        /* MODO NOTICIA */
        .modo-noticia .bloque-header-11, .modo-noticia .lista-jugadores, .modo-noticia .dt-info { display: none; }
        .modo-noticia #player-wrapper { height: 85%; bottom: -30px; left: 50%; transform: translateX(-50%); right: auto; }
        .logo-noticia { position: absolute; top: 30px; left: 30px; width: 50px; height: 50px; border-radius: 50%; background: var(--azul); border: 2px solid var(--oro); display: flex; align-items: center; justify-content: center; z-index: 20; box-shadow: 0 4px 10px black; }
        .bloque-noticia { position: absolute; z-index: 10; width: 100%; text-align: center; padding: 0 20px; bottom: 80px; box-sizing: border-box; }
        .modo-noticia h2 { font-family: 'Teko'; font-weight: 600; font-size: 42px; margin: 0; text-shadow: 2px 2px 4px black; }
        .modo-noticia h1 { font-family: 'Teko'; font-weight: 600; font-size: 64px; color: var(--oro); line-height: 0.9; margin: 5px 0 10px 0; text-shadow: 3px 3px 6px black; }
        .modo-noticia p { font-family: 'Teko'; font-weight: 400; font-size: 24px; color: #ddd; margin: 0; text-shadow: 1px 1px 3px black; }
        .modo-11 .logo-noticia, .modo-11 .bloque-noticia { display: none; }
        .oculto { display: none !important; }

        /* === CONTROLES RESPONSIVE === */
        .controls-section { padding: 10px; background: #111; border-top: 1px solid #333; }
        .tabs-menu { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 12px; margin-bottom: 5px; -webkit-overflow-scrolling: touch; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid #444; color: #aaa; padding: 12px 18px; border-radius: 8px; font-family: 'Oswald'; font-size: 14px; white-space: nowrap; transition: 0.2s; cursor: pointer; flex-shrink: 0; }
        .tab-btn.active { background: var(--oro); color: #000; border-color: var(--oro); font-weight: bold; }
        
        .tab-panel { display: none; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 20px; animation: fadeIn 0.3s ease; margin-bottom: 60px; }
        .tab-panel.active { display: block; }
        
        /* Inputs amigables para dedo */
        label { color: var(--oro); font-weight: bold; font-size: 12px; display: block; margin-bottom: 8px; font-family: 'Oswald'; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 14px; background: #000; border: 1px solid #444; color: white; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 10px; outline: none; font-family: 'Roboto Condensed'; appearance: none; -webkit-appearance: none; }
        
        .upload-btn-wrapper { position: relative; overflow: hidden; margin-bottom: 10px; }
        .btn-ghost { border: 1px dashed #666; color: #ccc; background: transparent; width: 100%; padding: 15px; border-radius: 8px; margin-top: 5px; cursor: pointer; font-size: 14px; }
        .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        
        input[type=range] { width: 100%; margin: 10px 0; accent-color: var(--oro); cursor: pointer; height: 6px; }
        .btn-small { background: #333; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 12px; cursor: pointer; width: 100%; margin-top: 5px; text-transform: uppercase; font-weight: bold; }

        /* Botones de Guardado */
        .btn-action-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-save { background: #007bff; color: white; border: none; padding: 12px; border-radius: 8px; flex: 1; font-family: 'Oswald'; font-weight: bold; }
        .btn-load { background: #6c757d; color: white; border: none; padding: 12px; border-radius: 8px; flex: 1; font-family: 'Oswald'; font-weight: bold; }

        /* UI FLOTANTE */
        .btn-descarga-flotante { position: fixed; bottom: 20px; right: 20px; width: 65px; height: 65px; border-radius: 50%; background: var(--oro); color: #001E38; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 20px rgba(242, 195, 23, 0.4); z-index: 9999; cursor: pointer; border: none; transition: transform 0.2s; -webkit-tap-highlight-color: transparent; }
        .btn-descarga-flotante:active { transform: scale(0.9); }
        
        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #111; padding: 25px; border-radius: 16px; text-align: center; width: 90%; max-width: 380px; border: 1px solid var(--oro); box-shadow: 0 0 30px rgba(242, 195, 23, 0.2); max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { font-family: 'Anton'; color: var(--oro); margin-top: 0; }
        .modal-content img { max-width: 100%; border-radius: 8px; display: block; margin: 15px auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); pointer-events: auto; }
        .btn-download-success { background: #28a745; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-family: 'Oswald'; width: 100%; margin-top: 10px; font-weight: bold; cursor: pointer; text-decoration: none; display: block; }
        .btn-close-modal { background: #333; color: white; border: none; padding: 12px; border-radius: 8px; margin-top: 10px; width: 100%; font-family: 'Oswald'; cursor: pointer; }

        /* MEDIA QUERIES PARA RESPONSIVE */
        @media (max-width: 450px) {
            #banner-container { transform: scale(0.85); margin: -20px 0; }
            .preview-section { min-height: 480px; padding: 10px; }
            .tab-btn { padding: 10px 14px; font-size: 13px; }
            .main-wrapper { padding-bottom: 60px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <nav class="navbar">
            <div class="brand">BZN12 <span style="color:#F2C317">STUDIO</span></div>

        <section class="preview-section">
            <div id="banner-container">

                    <div class="bloque-header-11">

        <section class="controls-section">

                                <input type="color" id="glow-color-picker" value="#F2C317" oninput="ajustarGlowFisico()" style="height:35px; width:50px; padding:0; border:none;">
                            </div>
                            <label>INTENSIDAD</label><input type="range" id="glow-opacity" min="0" max="1" step="0.1" value="0.8" oninput="ajustarGlowFisico()">
                            <label>GROSOR</label><input type="range" id="glow-blur" min="0" max="30" step="1" value="8" oninput="ajustarGlowFisico()">
                        </div>
                        <hr style="border-color:#444;">
                        <label style="display:flex; align-items:center; gap:10px; color:#90caf9;">
                            <input type="checkbox" id="chk-fade" onchange="toggleEfectosJugador()" style="width:20px; height:20px;" checked> 🌫️ FADE ATMOSFÉRICO
                        </label>
                    </div>
                </div>

                <!-- FONDOS -->
                <div id="tab-fondos" class="tab-panel">
                    <label>MODO VISUAL</label><select id="sel-modo" onchange="cambiarModo()"><option value="modo-11">📋 11 INICIAL</option><option value="modo-noticia">📰 NOTICIA</option></select>
                    <label>FONDO PREDEFINIDO</label>
                    <select id="sel-fondo" onchange="cambiarFondo()">
                        <option value="">-- Defecto --</option>
                        <option value="https://i.ibb.co/ZztT2CLn/Gemini-Generated-Image-r4y8efr4y8efr4y8.jpg">La Bombonera</option>
                        <option value="https://i.ibb.co/qMdYY24y/Chat-GPT-Image-26-ene-2026-23-06-53.png">Azul Institucional</option>
                        <option value="https://i.ibb.co/PvRdxvJd/Chat-GPT-Image-27-ene-2026-06-22-54.png">Fondo 3</option>
                        <option value="https://i.ibb.co/ynjHHs87/Generated-Image-January-27-2026-6-42-AM.png">Fondo 4</option>
                        <option value="https://i.ibb.co/Y425Q8CB/Generated-Image-January-27-2026-7-22-AM.png">Fondo 5</option>
                        <option value="https://i.ibb.co/LdCNPH5d/Generated-Image-January-27-2026-7-19-AM.png">Fondo 6</option>
                        <option value="https://i.ibb.co/HfP6phJb/Generated-Image-January-27-2026-7-17-AM.png">Fondo 7</option>
                    </select>
                    <div class="upload-btn-wrapper"><button class="btn-ghost">📂 Subir Fondo Propio</button><input type="file" id="file-fondo" accept="image/*" onchange="subirFondo()"></div>
                    <label>FILTROS</label>
                    <div style="display:flex; gap:10px;">
                        <div style="flex:1;"><label>BLUR</label><input type="range" id="range-blur" min="0" max="10" value="0" oninput="ajustarFiltrosFondo()"></div>
                        <div style="flex:1;"><label>OSCURIDAD</label><input type="range" id="range-dim" min="0" max="0.9" step="0.1" value="0" oninput="ajustarFiltrosFondo()"></div>
                    </div>
                    <label style="display:flex; gap:10px; align-items:center;"><input type="checkbox" id="chk-byn" onchange="ajustarFiltrosFondo()" style="width:auto;"> BLANCO Y NEGRO</label>
                </div>

                <!-- TEXTOS -->
                <div id="tab-textos" class="tab-panel">
                    <div id="panel-11">
                        <label>ENCABEZADO</label><input type="text" id="in-header" placeholder="Local - Visitante" onkeyup="actualizar()">
                        <label>LISTA DE JUGADORES</label><textarea id="in-lista" rows="6" placeholder="1. Apellido..." onkeyup="actualizarLista()"></textarea>
                        <label>DT</label><input type="text" id="in-dt" placeholder="DT" onkeyup="actualizar()">
                    </div>
                    <div id="panel-noticia" class="oculto">
                        <label>TITULAR</label><input type="text" id="in-titulo" placeholder="TITULAR" onkeyup="actualizar()">
                        <label>FRASE DESTACADA</label><textarea id="in-frase" rows="2" placeholder="FRASE" onkeyup="actualizar()"></textarea>
                        <label>BAJADA</label><input type="text" id="in-bajada" placeholder="Bajada" onkeyup="actualizar()">
                        <div style="display:flex; gap:5px; margin-top:10px;">
                            <input type="color" id="col-titulo" value="#ffffff" oninput="cambiarColorNoticia()" style="height:30px;">
                            <input type="color" id="col-frase" value="#F2C317" oninput="cambiarColorNoticia()" style="height:30px;">
                            <input type="color" id="col-bajada" value="#dddddd" oninput="cambiarColorNoticia()" style="height:30px;">
                        </div>
                    </div>
                    <hr style="border-color:#444; margin:20px 0;">
                    <label>CONFIGURAR FUENTE</label>
                    <select id="target-element"><option value="titulo-11">Título Principal</option><option value="lista-jugadores">Lista Jugadores</option><option value="news-title">Titular Noticia</option><option value="news-phrase">Frase Noticia</option></select>
                    <select id="sel-fuente" onchange="aplicarEstilos()"><option value="'Teko', sans-serif">Teko (Oficial)</option><option value="'Anton', sans-serif">Anton</option><option value="'Oswald', sans-serif">Oswald</option><option value="'Bebas Neue', cursive">Bebas Neue</option><option value="'Roboto Condensed', sans-serif">Roboto</option></select>
                    <div style="display:flex; gap:10px;">
                        <div style="flex:1;"><label>TAMAÑO</label><input type="range" id="rango-tamano" min="10" max="120" value="72" oninput="aplicarEstilos()"></div>
                        <div style="flex:1;"><label>ESPACIO</label><input type="range" id="rango-espaciado" min="-2" max="20" value="0" oninput="aplicarEstilos()"></div>
                    </div>
                    <label>PIE DE PÁGINA (LEGAL)</label><input type="text" id="in-legal" placeholder="Fuente..." onkeyup="actualizarLegal()">
                </div>

                <!-- ESCUDOS -->
                <div id="tab-escudos" class="tab-panel">
                    <label>LOCAL</label>
                    <select id="sel-escudo-1" onchange="cambiarEscudos()">
                         <option value="">-- Ninguno --</option>
                        <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Boca_Juniors_logo18.svg/500px-Boca_Juniors_logo18.svg.png">Boca Juniors</option>
                        <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Escudo_del_Club_Atl%C3%A9tico_River_Plate.svg/1200px-Escudo_del_Club_Atl%C3%A9tico_River_Plate.svg.png">River Plate</option>
                        <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Escudo_de_Racing_Club_%282014%29.svg/1920px-Escudo_de_Racing_Club_%282014%29.svg.png">Racing Club</option>
                        <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Escudo_del_Club_Atl%C3%A9tico_Independiente.svg/960px-Escudo_del_Club_Atl%C3%A9tico_Independiente.svg.png">Independiente</option>
                        <option value="https://upload.wikimedia.org/wikipedia/commons/6/62/Escudo_del_Club_Atl%C3%A9tico_San_Lorenzo_de_Almagro.png">San Lorenzo</option>
                    </select>
                    <label>VISITANTE</label>
                    <select id="sel-escudo-2" onchange="cambiarEscudos()">
                         <option value="">-- Ninguno --</option>
                        <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Boca_Juniors_logo18.svg/500px-Boca_Juniors_logo18.svg.png">Boca Juniors</option>
                        <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Escudo_del_Club_Atl%C3%A9tico_River_Plate.svg/1200px-Escudo_del_Club_Atl%C3%A9tico_River_Plate.svg.png">River Plate</option>
                        <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Escudo_de_Racing_Club_%282014%29.svg/1920px-Escudo_de_Racing_Club_%282014%29.svg.png">Racing Club</option>
                        <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Escudo_del_Club_Atl%C3%A9tico_Independiente.svg/960px-Escudo_del_Club_Atl%C3%A9tico_Independiente.svg.png">Independiente</option>
                        <option value="https://upload.wikimedia.org/wikipedia/commons/6/62/Escudo_del_Club_Atl%C3%A9tico_San_Lorenzo_de_Almagro.png">San Lorenzo</option>
                    </select>
                    <label>TAMAÑO</label>
                    <input type="range" id="size-escudos" min="20" max="100" value="45" oninput="ajustarTamanoEscudos()">
                </div>

                <!-- GUARDAR / EXTRAS (FUNCIONA) -->
                <div id="tab-guardar" class="tab-panel">
                    <label>FORMATO VISUAL</label>
                    <div class="pill-selector">
                        <button class="btn-small" onclick="cambiarFormato('original')">Vertical (Original)</button>
                        <button class="btn-small" onclick="cambiarFormato('story')">Story (Full)</button>
                        <button class="btn-small" onclick="cambiarFormato('square')">Cuadrado (Post)</button>
                    </div>
                    
                    <label>GUARDAR PROYECTO (LOCAL)</label>
                    <p style="font-size:12px; color:#888;">Guarda tus textos y posiciones para después.</p>
                    <div class="btn-action-row">
                        <button onclick="guardarConfig()" class="btn-save">💾 GUARDAR</button>
                        <button onclick="cargarConfig()" class="btn-load">📂 CARGAR</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- MODAL DE DESCARGA FINAL -->
    <div id="modal-descarga" class="modal-overlay">
        <div class="modal-content">
            <h3>¡IMAGEN GENERADA! 📸</h3>
            <p style="font-size:12px; color:#aaa;">Si el botón no funciona, mantén presionada la imagen para guardarla.</p>
            <img id="img-generada" src="" alt="Banner Generado">
            <a id="btn-descarga-final" href="#" download="BZN12_Banner.png" class="btn-download-success">📥 DESCARGAR AHORA</a>
            <button onclick="cerrarModal()" class="btn-close-modal">CERRAR</button>
        </div>
    </div>

    <script>
        // === ELEMENTOS GLOBALES ===
        const banner = document.getElementById('banner');
        // Inputs Principales
        const inHeader = document.getElementById('in-header');
        const inLista = document.getElementById('in-lista');
        const inDT = document.getElementById('in-dt');
        const inTitulo = document.getElementById('in-titulo');
        const inFrase = document.getElementById('in-frase');
        const inBajada = document.getElementById('in-bajada');
        const inLegal = document.getElementById('in-legal');
        
        // Selectores
        const selModo = document.getElementById('sel-modo');
        const selFondo = document.getElementById('sel-fondo');
        const selFoto = document.getElementById('sel-foto');
        const selEscudo1 = document.getElementById('sel-escudo-1');
        const selEscudo2 = document.getElementById('sel-escudo-2');
        
        // Imágenes
        const imgMain = document.getElementById('img-main'); 
        const imgGlow = document.getElementById('img-glow');
        const fadeLayer = document.getElementById('fade-layer');
        
        // Movimiento
        const selMoveTarget = document.getElementById('sel-move-target');
        const moveX = document.getElementById('move-x');
        const moveY = document.getElementById('move-y');
        const moveScale = document.getElementById('move-scale');
        
        // Estado
        let posiciones = {};
        let moveRafId = null;

        // === UI: TABS ===
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // === LÓGICA DE MOVIMIENTO ===
        function cargarPosicionElemento() {
            const id = selMoveTarget.value;
            if (!posiciones[id]) posiciones[id] = { x: 0, y: 0, s: 1 };
            moveX.value = posiciones[id].x;
            moveY.value = posiciones[id].y;
            moveScale.value = posiciones[id].s;
        }
        function requestUpdateTransform() {
            if (moveRafId) cancelAnimationFrame(moveRafId);
            moveRafId = requestAnimationFrame(() => {
                const id = selMoveTarget.value;
                const el = document.getElementById(id);
                if (el) {
                    const x = moveX.value; const y = moveY.value; const s = moveScale.value;
                    posiciones[id] = { x: x, y: y, s: s };
                    el.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
                }
            });
        }
        function resetearElementoActual() {
            const id = selMoveTarget.value;
            if(document.getElementById(id)) {
                document.getElementById(id).style.transform = 'none';
                posiciones[id] = { x: 0, y: 0, s: 1 };
                moveX.value = 0; moveY.value = 0; moveScale.value = 1;
                cargarPosicionElemento();
            }
        }

        // === EFECTOS JUGADOR ===
        function toggleEfectosJugador() {
            const glow = document.getElementById('chk-borde').checked;
            const fade = document.getElementById('chk-fade').checked;
            
            if (glow) {
                document.getElementById('img-glow').style.display = 'block';
                document.getElementById('controles-glow').style.display = 'block';
                ajustarGlowFisico();
            } else {
                document.getElementById('img-glow').style.display = 'none';
                document.getElementById('controles-glow').style.display = 'none';
            }
            
            document.getElementById('fade-layer').style.display = fade ? 'block' : 'none';
        }

        function ajustarGlowFisico() {
            const color = document.getElementById('glow-color-picker').value;
            const blur = document.getElementById('glow-blur').value + 'px';
            const opacity = document.getElementById('glow-opacity').value;
            const img = document.getElementById('img-glow');
            
            img.style.opacity = opacity;
            img.style.filter = `drop-shadow(0 0 ${blur} ${color}) drop-shadow(0 0 ${blur} ${color})`;
        }

        // === IMÁGENES Y FONDOS ===
        function cambiarFondo() { 
            document.querySelector('.fondo-img').style.backgroundImage = selFondo.value ? `url('${selFondo.value}')` : ''; 
        }
        function subirFondo() { 
            const f = document.getElementById('file-fondo').files[0]; 
            if(f) { const r = new FileReader(); r.onload = e => document.querySelector('.fondo-img').style.backgroundImage = `url('${e.target.result}')`; r.readAsDataURL(f); } 
        }
        function subirJugador() { 
            const f = document.getElementById('file-jugador').files[0]; 
            if(f) { 
                const r = new FileReader(); 
                r.onload = e => { 
                    imgMain.src = e.target.result; 
                    imgGlow.src = e.target.result;
                    document.getElementById('player-wrapper').style.pointerEvents = 'auto';
                    toggleEfectosJugador();
                }; 
                r.readAsDataURL(f); 
            } 
        }
        function ejecutarAccionJugador() {
            if(selFoto.value) {
                const action = document.querySelector('input[name="accion"]:checked').value;
                if(action !== 'lista') {
                    imgMain.src = selFoto.value;
                    imgGlow.src = selFoto.value;
                    document.getElementById('player-wrapper').style.pointerEvents = 'auto';
                    toggleEfectosJugador();
                }
                if(action !== 'foto') {
                    inLista.value += (inLista.value ? "\n" : "") + selFoto.options[selFoto.selectedIndex].text;
                    actualizarLista();
                }
            }
        }

        // === TEXTOS Y ACTUALIZACIONES ===
        function actualizar() {
            document.getElementById('mov-info-match').innerHTML = (inHeader.value || "Local - Visitante").replace('-', '<span style="color:#F2C317; margin:0 5px;">|</span>');
            document.getElementById('dt-nombre-val').innerText = inDT.value || "Mariano Herrón";
            document.getElementById('txt-titulo').innerText = inTitulo.value || "TITULAR";
            document.getElementById('txt-frase').innerText = inFrase.value || "FRASE PRINCIPAL";
            document.getElementById('txt-bajada').innerText = inBajada.value || "Bajada...";
        }
        function actualizarLista() {
            const lines = inLista.value.split('\n');
            let h = "";
            lines.forEach(l => {
                if(l.trim()) {
                    let p = l.trim().split(/\s+/);
                    let n = (!isNaN(parseFloat(p[0]))) ? p.shift().replace('.','') : "-";
                    h += `<div class="fila-jugador"><div class="dorsal">${n}</div><div class="nombre-completo"><span class="nombre-pila">${p.join(' ')}</span></div></div>`;
                }
            });
            document.getElementById('mov-lista').innerHTML = h;
            aplicarEstilos();
        }
        function actualizarLegal() {
            document.getElementById('mov-legal').innerText = inLegal.value || "BZN12 | Fuente: Prensa Boca";
        }
        
        // === ESTILOS Y FILTROS ===
        function ajustarFiltrosFondo() {
            const blur = document.getElementById('range-blur').value + 'px';
            const gray = document.getElementById('chk-byn').checked ? '100%' : '0%';
            document.querySelector('.fondo-img').style.filter = `blur(${blur}) grayscale(${gray})`;
            document.getElementById('overlay-dim').style.opacity = document.getElementById('range-dim').value;
        }
        function cambiarEscudos() {
            document.getElementById('img-escudo-1').src = selEscudo1.value || ''; document.getElementById('img-escudo-1').style.display = selEscudo1.value ? 'block':'none';
            document.getElementById('img-escudo-2').src = selEscudo2.value || ''; document.getElementById('img-escudo-2').style.display = selEscudo2.value ? 'block':'none';
        }
        function ajustarTamanoEscudos() {
            const s = document.getElementById('size-escudos').value + 'px';
            document.getElementById('img-escudo-1').style.width = s; document.getElementById('img-escudo-1').style.height = s;
            document.getElementById('img-escudo-2').style.width = s; document.getElementById('img-escudo-2').style.height = s;
        }
        function aplicarEstilos() {
            const font = document.getElementById('sel-fuente').value;
            const size = document.getElementById('rango-tamano').value + 'px';
            const space = document.getElementById('rango-espaciado').value + 'px';
            const target = document.getElementById('target-element').value;
            
            let els = [];
            if(target === 'titulo-11') els = document.querySelectorAll('.target-titulo-11');
            else if(target === 'lista-jugadores') els = document.querySelectorAll('.fila-jugador');
            else if(target === 'news-title') els = document.querySelectorAll('.target-news-title');
            else if(target === 'news-phrase') els = document.querySelectorAll('.target-news-phrase');
            
            els.forEach(el => {
                if(target === 'lista-jugadores') el.style.fontSize = size;
                else { el.style.fontFamily = font; el.style.fontSize = size; el.style.letterSpacing = space; }
            });
            if(target === 'lista-jugadores') document.querySelectorAll('.nombre-pila, .apellido').forEach(n => n.style.fontFamily = font);
        }
        function cambiarModo() {
            const modo = selModo.value;
            banner.className = 'lienzo ' + modo;
            document.getElementById('panel-11').classList.toggle('oculto', modo !== 'modo-11');
            document.getElementById('panel-noticia').classList.toggle('oculto', modo !== 'modo-noticia');
        }
        function cambiarFormato(t) { banner.className = 'lienzo ' + selModo.value + ' formato-' + t; }

        // === GUARDAR Y CARGAR (LOCALSTORAGE) ===
        function guardarConfig() {
            const config = {
                header: inHeader.value,
                lista: inLista.value,
                dt: inDT.value,
                fondo: selFondo.value,
                escudo1: selEscudo1.value,
                escudo2: selEscudo2.value,
                posiciones: posiciones
            };
            localStorage.setItem('bzn_config', JSON.stringify(config));
            alert('✅ Configuración guardada en este dispositivo.');
        }

        function cargarConfig() {
            const data = localStorage.getItem('bzn_config');
            if(data) {
                const config = JSON.parse(data);
                if(config.header) inHeader.value = config.header;
                if(config.lista) inLista.value = config.lista;
                if(config.dt) inDT.value = config.dt;
                if(config.fondo) { selFondo.value = config.fondo; cambiarFondo(); }
                if(config.escudo1) { selEscudo1.value = config.escudo1; }
                if(config.escudo2) { selEscudo2.value = config.escudo2; }
                if(config.posiciones) { 
                    posiciones = config.posiciones;
                    // Restaurar transformaciones visualmente
                    for (const [id, val] of Object.entries(posiciones)) {
                        const el = document.getElementById(id);
                        if(el) el.style.transform = `translate(${val.x}px, ${val.y}px) scale(${val.s})`;
                    }
                }
                actualizar();
                actualizarLista();
                cambiarEscudos();
                alert('📂 Configuración cargada correctamente.');
            } else {
                alert('⚠️ No hay configuraciones guardadas.');
            }
        }

        // === GENERADOR DE IMAGEN ===
        function generarImagen() {
            // Asegurar filtros
            if(document.getElementById('chk-borde').checked) ajustarGlowFisico();
            
            const node = document.getElementById('banner');
            
            // Usamos un pequeño delay para asegurar renderizado
            setTimeout(() => {
                htmlToImage.toPng(node, {
                    cacheBust: true,
                    pixelRatio: 2,
                    backgroundColor: null,
                    useCORS: true, // Crucial para imágenes externas
                    filter: (n) => (n.tagName !== 'LINK' && n.tagName !== 'SCRIPT')
                })
                .then((dataUrl) => {
                    const img = document.getElementById('img-generada');
                    const btnDescarga = document.getElementById('btn-descarga-final');
                    
                    img.src = dataUrl;
                    btnDescarga.href = dataUrl;
                    btnDescarga.download = `BZN_Banner_${Date.now()}.png`;
                    
                    document.getElementById('modal-descarga').style.display = 'flex';
                })
                .catch((err) => {
                    console.error(err);
                    alert("Error al generar imagen. Intenta recargar.");
                });
            }, 100);
        }
        function cerrarModal() { document.getElementById('modal-descarga').style.display = 'none'; }
    </script>
</body>
</html>
