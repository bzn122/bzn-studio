<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#001E38">
    <title>BZN12 Studio PRO</title>
    
    <!-- FUENTES -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;800&family=Bebas+Neue&family=Chakra+Petch:wght@700&family=Do+Hyeon&family=Exo+2:wght@700&family=Fjalla+One&family=Kanit:wght@700&family=Oswald:wght@500;700&family=Passion+One:wght@700&family=Righteous&family=Roboto+Condensed:wght@300;400;700&family=Russo+One&family=Saira+Extra+Condensed:wght@700&family=Teko:wght@400;600&family=Titillium+Web:wght@700&family=Montserrat:wght@800&family=Playfair+Display:wght@700&family=Lobster&family=Orbitron:wght@700&family=Bangers&display=swap" rel="stylesheet">
    
    <!-- LIBRERÍA DE EXPORTACIÓN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

    <style>
        :root { 
            --azul: #001E38; 
            --oro: #F2C317; 
            --dark-bg: #000810; /* Fondo más oscuro para fundir */
        }
        
        /* GENERAL */
        html, body { margin: 0; padding: 0; font-family: 'Roboto Condensed', sans-serif; background: #080808; color: white; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); user-select: none; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        
        /* NAVBAR */
        .navbar { background: rgba(0, 30, 56, 0.95); backdrop-filter: blur(10px); padding: 15px; text-align: center; border-bottom: 2px solid var(--oro); position: sticky; top: 0; z-index: 1000; font-family: 'Anton'; font-size: 24px; letter-spacing: 1px; }

        /* AREA DE PREVISUALIZACIÓN */
        .preview-section { padding: 30px 10px; display: flex; justify-content: center; background: radial-gradient(circle at center, #1a2a3a 0%, #000000 100%); min-height: 550px; align-items: center; }
        #banner-container { transform-origin: center center; box-shadow: 0 30px 60px rgba(0,0,0,0.8); position: relative; border: 1px solid #333; }

        /* LIENZO PRINCIPAL */
        .lienzo { width: 400px; height: 500px; position: relative; overflow: hidden; background: var(--dark-bg); }

        /* CAPAS DE FONDO */
        .fondo-img { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 1; transition: filter 0.2s; }
        .fondo-sombra { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at top right, transparent 30%, rgba(0,0,0,0.8) 100%); z-index: 2; pointer-events: none; }
        .overlay-dim { position: absolute; width: 100%; height: 100%; background: #000; opacity: 0; z-index: 2; pointer-events: none; }

        /* === JUGADOR Y EFECTOS === */
        #player-wrapper {
            position: absolute; bottom: 0; right: -50px; width: 300px; height: 75%; z-index: 5;
            transform-origin: bottom center; pointer-events: none;
        }

        /* 1. Brillo Trasero (Glow) */
        .player-glow {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1;
            display: none; transform: scale(1.03); 
            /* Se controla con JS inline para exportar bien */
        }

        /* 2. Jugador Principal */
        .player-main {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2;
        }

        /* 3. ATMOSPHERE FADE (El efecto de la foto de referencia) */
        .player-fade-layer {
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 45%; /* Más alto para cubrir cintura */
            z-index: 6; /* Encima del jugador */
            pointer-events: none;
            display: none;
            
            /* DEGRADADO PROFESIONAL: Coincide con el color de fondo */
            background: linear-gradient(
                to top,
                var(--dark-bg) 15%,             /* Color sólido abajo */
                rgba(0, 8, 16, 0.95) 30%,       /* Transición suave */
                rgba(0, 8, 16, 0.7) 50%,        
                rgba(0, 8, 16, 0.4) 70%,
                transparent 100%
            );
            
            /* Truco para suavizar los pixeles (Blur en la base) */
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        /* TEXTOS Y ELEMENTOS UI */
        .bloque-header-11 { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 10; }
        .logo-bzn { position: absolute; top: 20px; left: 20px; width: 50px; height: 50px; border-radius: 50%; background: var(--azul); border: 2px solid var(--oro); display: flex; align-items: center; justify-content: center; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .logo-bzn img, .escudo-mini, .logo-noticia img { width: 100%; height: 100%; object-fit: contain; }
        
        .titulo-formacion { position: absolute; top: 20px; left: 95px; z-index: 10; font-family: 'Teko'; font-weight: 600; font-size: 72px; color: white; letter-spacing: -1px; line-height: 0.8; text-shadow: 2px 2px 4px rgba(0,0,0,1); }
        .info-partido { position: absolute; top: 85px; left: 100px; z-index: 10; font-size: 16px; color: #ddd; font-family: 'Teko'; letter-spacing: 0.5px; text-shadow: 1px 1px 3px rgba(0,0,0,1); }
        .escudos-container { position: absolute; top: 25px; right: 20px; display: flex; gap: 5px; z-index: 50; }
        .escudo-mini { width: 45px; height: 45px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        
        .lista-jugadores { position: absolute; z-index: 5; top: 120px; left: 20px; display: flex; flex-direction: column; text-shadow: 1px 1px 3px black; }
        .fila-jugador { display: flex; align-items: center; line-height: 1.1; }
        .dorsal { font-family: 'Oswald'; font-weight: 700; color: var(--oro); width: 35px; text-align: right; margin-right: 12px; font-size: 1.1em; }
        .nombre-completo { text-transform: uppercase; letter-spacing: 0.5px; }
        .nombre-pila { font-family: 'Roboto Condensed'; font-weight: 300; color: rgba(255,255,255,0.7); margin-right: 6px; font-size: 1em; }
        .apellido { font-family: 'Roboto Condensed'; font-weight: 700; color: white; font-size: 1em; }
        
        .dt-info { position: absolute; bottom: 60px; left: 20px; z-index: 10; font-family: 'Teko'; font-size: 24px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 5px; width: 150px; text-shadow: 1px 1px 2px black; }
        .dt-label { color: var(--oro); font-weight: 700; margin-right: 10px; }
        .legal { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 10px; color: #777; z-index: 20; text-shadow: 1px 1px 2px black; font-family: 'Roboto Condensed'; }

        /* MODO NOTICIA */
        .modo-noticia .bloque-header-11, .modo-noticia .lista-jugadores, .modo-noticia .dt-info { display: none; }
        .modo-noticia #player-wrapper { height: 85%; bottom: -30px; left: 50%; transform: translateX(-50%); right: auto; }
        .logo-noticia { position: absolute; top: 30px; left: 30px; width: 50px; height: 50px; border-radius: 50%; background: var(--azul); border: 2px solid var(--oro); display: flex; align-items: center; justify-content: center; z-index: 20; box-shadow: 0 4px 10px black; }
        .bloque-noticia { position: absolute; z-index: 10; width: 100%; text-align: center; padding: 0 20px; bottom: 80px; box-sizing: border-box; }
        .modo-noticia h2 { font-family: 'Teko'; font-weight: 600; font-size: 42px; margin: 0; text-shadow: 2px 2px 4px black; }
        .modo-noticia h1 { font-family: 'Teko'; font-weight: 600; font-size: 64px; color: var(--oro); line-height: 0.9; margin: 5px 0 10px 0; text-shadow: 3px 3px 6px black; }
        .modo-noticia p { font-family: 'Teko'; font-weight: 400; font-size: 24px; color: #ddd; margin: 0; text-shadow: 1px 1px 3px black; }
        .modo-11 .logo-noticia, .modo-11 .bloque-noticia { display: none; }
        .oculto { display: none !important; }

        /* CONTROLES */
        .controls-section { padding: 15px; background: #111; border-top: 1px solid #333; }
        .tabs-menu { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 12px; margin-bottom: 5px; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid #444; color: #aaa; padding: 10px 16px; border-radius: 8px; font-family: 'Oswald'; font-size: 14px; white-space: nowrap; transition: 0.2s; cursor: pointer; }
        .tab-btn.active { background: var(--oro); color: #000; border-color: var(--oro); font-weight: bold; transform: scale(1.05); }
        .tab-panel { display: none; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 20px; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }
        .glass-card-inner { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 15px; border: 1px solid #333; margin-top: 15px; }
        label { color: var(--oro); font-weight: bold; font-size: 11px; display: block; margin-bottom: 6px; font-family: 'Oswald'; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: white; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 12px; outline: none; font-family: 'Roboto Condensed'; }
        .pill-selector { display: flex; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        .pill { flex: 1; text-align: center; cursor: pointer; margin: 0; }
        .pill input { display: none; }
        .pill span { display: block; padding: 8px; border-radius: 6px; font-size: 12px; color: #aaa; transition: 0.3s; }
        .pill input:checked + span { background: var(--oro); color: #000; font-weight: bold; }
        .upload-btn-wrapper { position: relative; overflow: hidden; margin-bottom: 10px; }
        .btn-ghost { border: 1px dashed #666; color: #ccc; background: transparent; width: 100%; padding: 12px; border-radius: 8px; margin-top: 5px; cursor: pointer; }
        .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .slider-box { background: rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 8px; border: 1px solid #333; margin-top: 10px; }
        .range-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        input[type=range] { width: 100%; margin: 0; accent-color: var(--oro); cursor: pointer; }
        .btn-small { background: #333; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; width: 100%; margin-top: 5px; text-transform: uppercase; font-weight: bold; }
        
        .formato-story { width: 360px !important; height: 640px !important; }
        .formato-square { width: 400px !important; height: 400px !important; }

        /* UI FLOTANTE */
        .btn-descarga-flotante { position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px; border-radius: 50%; background: var(--oro); color: #001E38; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 20px rgba(242, 195, 23, 0.4); z-index: 9999; cursor: pointer; border: none; transition: transform 0.2s; }
        .btn-descarga-flotante:active { transform: scale(0.9); }
        
        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #111; padding: 25px; border-radius: 16px; text-align: center; width: 85%; max-width: 400px; border: 1px solid var(--oro); box-shadow: 0 0 30px rgba(242, 195, 23, 0.2); }
        .modal-content h3 { font-family: 'Anton'; color: var(--oro); margin-top: 0; }
        .modal-content img { max-width: 100%; border-radius: 8px; display: block; margin: 15px auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .btn-download-success { background: #28a745; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-family: 'Oswald'; width: 100%; margin-top: 10px; font-weight: bold; cursor: pointer; }
        .btn-close-modal { background: #333; color: white; border: none; padding: 12px; border-radius: 8px; margin-top: 10px; width: 100%; font-family: 'Oswald'; cursor: pointer; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <nav class="navbar">
            <div class="brand">BZN12 <span style="color:#F2C317">PRO</span></div>

        <section class="preview-section">

                    <div class="bloque-header-11">
                        <div id="mov-logo-11" class="logo-bzn"><img src="https://i.ibb.co/kgjTkMDX/Gemini-Generated-Image-ky6p34ky6p34ky6p-Photoroom.png" crossorigin="anonymous"></div>
                        <div id="mov-titulo-11" class="titulo-formacion target-titulo-11"><span style="color:#F2C317">11</span> INICIAL</div>

        <section class="controls-section">

                <button class="tab-btn" onclick="switchTab('tab-guardar', this)">💾 EXTRAS</button>

                    <div class="glass-card-inner">
                        <label style="color:#FFF; border-bottom:1px solid #444; padding-bottom:5px; margin-bottom:10px;">✨ EFECTOS VISUALES</label>
                        
                        <!-- CONTROL GLOW -->

    <script>
        // === VARIABLES Y SELECTORES ===
        const banner = document.getElementById('banner');
        const selModo = document.getElementById('sel-modo');
        const selFondo = document.getElementById('sel-fondo');
        const selFoto = document.getElementById('sel-foto');
        const imgMain = document.getElementById('img-main'); 
        const imgGlow = document.getElementById('img-glow');
        const fadeLayer = document.getElementById('fade-layer');
        const fileFondo = document.getElementById('file-fondo');
        const fileJugador = document.getElementById('file-jugador');

        // Movimiento
        const selMoveTarget = document.getElementById('sel-move-target');
        const moveX = document.getElementById('move-x');
        const moveY = document.getElementById('move-y');
        const moveScale = document.getElementById('move-scale');
        let moveRafId = null;
        const posiciones = {};

        // Efectos
        const chkBorde = document.getElementById('chk-borde');
        const chkFade = document.getElementById('chk-fade');
        const glowColorPicker = document.getElementById('glow-color-picker');
        const sliderGlowOpacity = document.getElementById('glow-opacity');
        const sliderGlowBlur = document.getElementById('glow-blur');
        const panelGlow = document.getElementById('controles-glow');

        // Textos y Escudos
        const chkByn = document.getElementById('chk-byn');
        const rangeBlur = document.getElementById('range-blur');
        const rangeDim = document.getElementById('range-dim');
        const overlayDim = document.getElementById('overlay-dim');
        const targetElement = document.getElementById('target-element');
        const selFuente = document.getElementById('sel-fuente');
        const rangoTamano = document.getElementById('rango-tamano');
        const rangoEspaciado = document.getElementById('rango-espaciado');

        const selEscudo1 = document.getElementById('sel-escudo-1');
        const selEscudo2 = document.getElementById('sel-escudo-2');
        const imgEscudo1 = document.getElementById('img-escudo-1');
        const imgEscudo2 = document.getElementById('img-escudo-2');
        const sliderSizeEscudos = document.getElementById('size-escudos');

        const inHeader = document.getElementById('in-header');
        const inLista = document.getElementById('in-lista');
        const inDT = document.getElementById('in-dt');
        const inTitulo = document.getElementById('in-titulo');
        const inFrase = document.getElementById('in-frase');
        const inBajada = document.getElementById('in-bajada');
        const inLegal = document.getElementById('in-legal');

        // === UI TABS ===
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // === SISTEMA DE MOVIMIENTO FLUIDO ===
        function cargarPosicionElemento() {
            const id = selMoveTarget.value;
            if (!posiciones[id]) posiciones[id] = { x: 0, y: 0, s: 1 };
            moveX.value = posiciones[id].x;
            moveY.value = posiciones[id].y;
            moveScale.value = posiciones[id].s;
        }
        
        function requestUpdateTransform() {
            if (moveRafId) cancelAnimationFrame(moveRafId);
            moveRafId = requestAnimationFrame(aplicarTransformacion);
        }

        function aplicarTransformacion() {
            const id = selMoveTarget.value;
            const el = document.getElementById(id);
            if (el) {
                const x = moveX.value; const y = moveY.value; const s = moveScale.value;
                posiciones[id] = { x: x, y: y, s: s };
                el.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
            }
        }
        
        function resetearElementoActual() {
            const id = selMoveTarget.value;
            if(document.getElementById(id)) {
                document.getElementById(id).style.transform = 'none';
                posiciones[id] = { x: 0, y: 0, s: 1 };
                moveX.value = 0; moveY.value = 0; moveScale.value = 1;
            }
        }

        // === GESTIÓN DE EFECTOS (Fade y Glow) ===
        function ajustarGlowFisico() {
            const color = glowColorPicker.value;
            const blur = sliderGlowBlur.value + 'px';
            const opacity = sliderGlowOpacity.value;
            imgGlow.style.opacity = opacity;
            // Usamos drop-shadow porque se renderiza mejor que filtros complejos
            imgGlow.style.filter = `drop-shadow(0 0 ${blur} ${color}) drop-shadow(0 0 ${blur} ${color})`;
        }

        function toggleEfectosJugador() {
            // Glow
            if (chkBorde.checked) { 
                imgGlow.style.display = 'block';
                panelGlow.style.display = 'block';
                ajustarGlowFisico();
            } else { 
                imgGlow.style.display = 'none';
                panelGlow.style.display = 'none';
            }
            // Fade
            fadeLayer.style.display = chkFade.checked ? 'block' : 'none';
        }

        // === FONDOS Y FILTROS ===
        function cambiarFondo() { 
            document.querySelector('.fondo-img').style.backgroundImage = selFondo.value ? `url('${selFondo.value}')` : ''; 
        }
        function subirFondo() { 
            const f = fileFondo.files[0]; 
            if(f) { 
                const r = new FileReader(); 
                r.onload = e => document.querySelector('.fondo-img').style.backgroundImage = `url('${e.target.result}')`; 
                r.readAsDataURL(f); 
            } 
        }
        function ajustarFiltrosFondo() {
            const blur = rangeBlur.value + 'px'; const gray = chkByn.checked ? '100%' : '0%';
            document.querySelector('.fondo-img').style.filter = `blur(${blur}) grayscale(${gray})`;
            overlayDim.style.opacity = rangeDim.value;
        }

        // === JUGADOR ===
        function ejecutarAccionJugador() { 
            if(selFoto.value) { 
                const selectedText = selFoto.options[selFoto.selectedIndex].text;
                const action = document.querySelector('input[name="accion"]:checked').value;
                
                if(action !== 'lista') { 
                    imgMain.src = selFoto.value; 
                    imgGlow.src = selFoto.value;
                    document.getElementById('player-wrapper').style.pointerEvents = 'auto';
                    toggleEfectosJugador();
                } 
                if(action !== 'foto') { 
                    inLista.value += (inLista.value ? "\n" : "") + selectedText; 
                    actualizarLista(); 
                } 
            } 
        }

        function subirJugador() { 
            const f = fileJugador.files[0]; 
            if(f) { 
                const r = new FileReader(); 
                r.onload = e => { 
                    imgMain.src = e.target.result; 
                    imgGlow.src = e.target.result;
                    document.getElementById('player-wrapper').style.pointerEvents = 'auto';
                    toggleEfectosJugador();
                }; 
                r.readAsDataURL(f); 
            } 
        }

        // === TEXTOS Y ESCUDOS ===
        function actualizar() { 
            const txtHeader = document.getElementById('mov-info-match'); 
            const dtNombreVal = document.getElementById('dt-nombre-val');
            const txtTitulo = document.getElementById('txt-titulo');
            const txtFrase = document.getElementById('txt-frase');
            const txtBajada = document.getElementById('txt-bajada');
            
            if(txtHeader) txtHeader.innerHTML = (inHeader.value || "Local - Visitante").replace('-', '<span style="color:#F2C317; margin:0 5px; font-weight:bold;">|</span>');
            if(dtNombreVal) dtNombreVal.innerText = inDT.value || "Mariano Herrón"; 
            if(txtTitulo) txtTitulo.innerText = inTitulo.value || "TITULAR"; 
            if(txtFrase) txtFrase.innerText = inFrase.value || "FRASE PRINCIPAL"; 
            if(txtBajada) txtBajada.innerText = inBajada.value || "Bajada..."; 
        }

        function actualizarLista() { 
            const listaVis = document.getElementById('mov-lista');
            const lines = inLista.value.split('\n'); 
            let h = ""; 
            lines.forEach(l => { 
                if(l.trim()) { 
                    let p = l.trim().split(/\s+/); 
                    let n = (!isNaN(parseFloat(p[0]))) ? p.shift().replace('.','') : "-"; 
                    let rest = p.join(' '); 
                    let words = rest.split(' '); 
                    let ape = words.pop(); 
                    h += `<div class="fila-jugador"><div class="dorsal">${n}</div><div class="nombre-completo"><span class="nombre-pila">${words.join(' ')}</span> <span class="apellido">${ape}</span></div></div>`; 
                } 
            }); 
            if(listaVis) listaVis.innerHTML = h; 
            aplicarEstilos(); 
        }

        function aplicarEstilos() {
            const font = selFuente.value; 
            const size = rangoTamano.value + 'px'; 
            const space = rangoEspaciado.value + 'px'; 
            
            if(targetElement.value === 'lista-jugadores') { 
                document.querySelectorAll('.nombre-pila, .apellido, .dorsal').forEach(n => n.style.fontFamily = font); 
                document.querySelectorAll('.fila-jugador').forEach(f => f.style.fontSize = size); 
            } else {
                let els = [];
                if(targetElement.value === 'titulo-11') els = document.querySelectorAll('.target-titulo-11');
                else if(targetElement.value === 'info-match') els = document.querySelectorAll('.target-info-match');
                else if(targetElement.value === 'dt-info') els = document.querySelectorAll('.target-dt-info');
                else if(targetElement.value === 'news-title') els = document.querySelectorAll('.target-news-title');
                else if(targetElement.value === 'news-phrase') els = document.querySelectorAll('.target-news-phrase');
                else if(targetElement.value === 'news-bajada') els = document.querySelectorAll('.target-news-bajada');
                else if(targetElement.value === 'legal-text') els = document.querySelectorAll('.target-legal');
                els.forEach(el => { el.style.fontFamily = font; el.style.fontSize = size; el.style.letterSpacing = space; });
            }
        }

        function cambiarEscudos() { 
            imgEscudo1.src = selEscudo1.value || ''; imgEscudo1.style.display = selEscudo1.value ? 'block' : 'none'; 
            imgEscudo2.src = selEscudo2.value || ''; imgEscudo2.style.display = selEscudo2.value ? 'block' : 'none'; 
        }
        function ajustarTamanoEscudos() { 
            const val = sliderSizeEscudos.value + 'px';
            imgEscudo1.style.width = val; imgEscudo1.style.height = val; 
            imgEscudo2.style.width = val; imgEscudo2.style.height = val; 
        }
        function actualizarLegal() { const txtLegal = document.getElementById('mov-legal'); if(txtLegal) txtLegal.innerText = inLegal.value || "BZN12 | Fuente: Prensa Boca"; }
        function cambiarModo() { 
            const p11 = document.getElementById('panel-11');
            const pNoticia = document.getElementById('panel-noticia');
            const modo = selModo.value;
            banner.className = 'lienzo ' + modo; 
            if(modo === 'modo-11') { p11.classList.remove('oculto'); pNoticia.classList.add('oculto'); } 
            else { p11.classList.add('oculto'); pNoticia.classList.remove('oculto'); }
        }
        function cambiarFormato(t) { banner.className = 'lienzo ' + selModo.value + ' formato-' + t; }
        function cambiarColorNoticia() {
            const txtTitulo = document.getElementById('txt-titulo');
            const txtFrase = document.getElementById('txt-frase');
            const txtBajada = document.getElementById('txt-bajada');
            txtTitulo.style.color = document.getElementById('col-titulo').value;
            txtFrase.style.color = document.getElementById('col-frase').value;
            txtBajada.style.color = document.getElementById('col-bajada').value;
        }

        // === GENERADOR DE IMAGEN (REPARADO Y SIMPLIFICADO) ===
        function generarImagen() {
            toggleEfectosJugador();
            const node = document.getElementById('banner');

            // Pequeña espera para renderizado
            setTimeout(() => {
                htmlToImage.toPng(node, { 
                    cacheBust: true, 
                    pixelRatio: 2, 
                    backgroundColor: null,
                    useCORS: true, // Importante para imagenes de IBB
                    // Evita errores con scripts o links externos
                    filter: (node) => (node.tagName !== 'LINK' && node.tagName !== 'SCRIPT')
                })
                .then(function (dataUrl) {
                    const img = document.getElementById('img-generada');
                    const btnDescarga = document.getElementById('btn-descarga-final');
                    
                    img.src = dataUrl;
                    btnDescarga.href = dataUrl; // Descarga directa del base64 (Más compatible)
                    btnDescarga.download = `BZN_Studio_${Date.now()}.png`;
                    
                    document.getElementById('modal-descarga').style.display = 'flex';
                })
                .catch(function (error) {
                    console.error('Error al generar imagen:', error);
                    alert('Error: No se pudo generar la imagen. Intenta recargar la página o usar otro navegador.');
                });
            }, 100);
        }

        function cerrarModal() { document.getElementById('modal-descarga').style.display = 'none'; }
        function guardarDatos() { alert("Guardado en LocalStorage (Simulado)"); }
        function cargarDatos() { alert("Configuración Cargada"); }
    </script>
</body>
</html>
